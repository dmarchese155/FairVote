[project]
name = "fairvote"
version = "0.1.0"
description = "Scripts for FairVote to make things run easier."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.3",
    "pyairtable>=3.4.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.3.260530",
    "pylint>=4.0.5",
]

[tool.mypy]
strict = false
